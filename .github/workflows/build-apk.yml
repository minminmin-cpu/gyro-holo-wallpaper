name: Build release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 只用官方 action；构建与发布走 runner 自带工具。
      # 构建日志同时写入 Job Summary，失败时无需登录即可看到原因。
      - name: Build signed APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          {
            echo "### 构建环境"
            echo '```'
            java -version 2>&1 | head -3
            gradle --version 2>&1 | head -8
            ls -d "$ANDROID_HOME" 2>&1
            ls "$ANDROID_HOME" 2>&1 | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cd android
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > app/release.jks
            PASS="$KS_PASS"
            ALIAS="${KS_ALIAS:-release}"
            KPASS="${KS_KEY_PASS:-$KS_PASS}"
          else
            PASS="$(openssl rand -hex 16)"
            ALIAS="ci"
            KPASS="$PASS"
            keytool -genkeypair -keystore app/release.jks -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CI, O=Holo, C=CN"
          fi
          set +e
          KEYSTORE_FILE=app/release.jks \
          KEYSTORE_PASSWORD="$PASS" \
          KEY_ALIAS="$ALIAS" \
          KEY_PASSWORD="$KPASS" \
            gradle :app:assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1
          STATUS=$?
          set -e
          {
            echo "### gradle 输出（末尾 120 行）"
            echo '```'
            tail -120 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            MSG="$(grep -E 'What went wrong|Caused by|FAILURE:|error:|Error:|Could not|Couldn.t|not found|SDK|Unsupported|requires' /tmp/build.log \
              | grep -v '^\s*at ' | head -12 | tr '\n' '~' | tr -d '%' | cut -c1-2000)"
            echo "::error title=gradle build failed::$MSG"
            exit "$STATUS"
          fi
          sha256sum app/build/outputs/apk/release/app-release.apk | tee ../APK_SHA256.txt
          {
            echo "### 产物"
            echo '```'
            cat ../APK_SHA256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            android/app/build/outputs/apk/release/app-release.apk \
            APK_SHA256.txt \
            --title "流光 Holo Wallpaper ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.jks
