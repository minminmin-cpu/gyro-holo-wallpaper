name: Build release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 只使用 GitHub 官方 action；构建与发布都走 runner 自带的 gradle / gh，
      # 避免组织策略限制第三方 action 时整条流水线启动失败。
      - name: Build signed APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd android
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > app/release.jks
            PASS="$KS_PASS"
            ALIAS="${KS_ALIAS:-release}"
            KPASS="${KS_KEY_PASS:-$KS_PASS}"
          else
            PASS="$(openssl rand -hex 16)"
            ALIAS="ci"
            KPASS="$PASS"
            keytool -genkeypair -keystore app/release.jks -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CI, O=Holo, C=CN"
          fi
          KEYSTORE_FILE=app/release.jks \
          KEYSTORE_PASSWORD="$PASS" \
          KEY_ALIAS="$ALIAS" \
          KEY_PASSWORD="$KPASS" \
            gradle :app:assembleRelease --no-daemon
          sha256sum app/build/outputs/apk/release/app-release.apk | tee ../APK_SHA256.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "${GITHUB_REF_NAME}" \
            android/app/build/outputs/apk/release/app-release.apk \
            APK_SHA256.txt \
            --title "流光 Holo Wallpaper ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.jks
