name: Build release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 有 Secrets 就用固定密钥（可覆盖升级）；没有则生成一次性密钥，保证产物可安装。
      - name: Sign and assemble
        working-directory: android
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > app/release.jks
            PASS="$KS_PASS"
            ALIAS="${KS_ALIAS:-release}"
            KPASS="${KS_KEY_PASS:-$KS_PASS}"
          else
            PASS="$(openssl rand -hex 16)"
            ALIAS="ci"
            KPASS="$PASS"
            keytool -genkeypair -keystore app/release.jks -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CI, O=Holo, C=CN"
          fi
          KEYSTORE_FILE=app/release.jks \
          KEYSTORE_PASSWORD="$PASS" \
          KEY_ALIAS="$ALIAS" \
          KEY_PASSWORD="$KPASS" \
            gradle :app:assembleRelease --no-daemon

      - name: Checksums
        run: |
          set -e
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > "$GITHUB_WORKSPACE/APK_SHA256.txt"
          cat "$GITHUB_WORKSPACE/APK_SHA256.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            APK_SHA256.txt

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.jks
