name: Build release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # 仓库不提交 gradle-wrapper.jar（二进制），用 setup-gradle 提供的 gradle CLI 构建。
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 优先使用仓库 Secrets 里的固定密钥（可覆盖升级）；
      # 未配置时会生成一次性密钥，保证本次产物仍可安装，但下一次构建会更换签名。
      - name: Prepare signing keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          echo "jks_path=android/app/release.jks" >> "$GITHUB_OUTPUT"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf '%s' "${SECRET_STORE_PASS:-}" > "$RUNNER_TEMP/ks/store.pass"
            printf '%s' "${SECRET_KEY_PASS:-${SECRET_STORE_PASS:-}}" > "$RUNNER_TEMP/ks/key.pass"
            echo "alias=${SECRET_KEY_ALIAS:-ci}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "使用时使用仓库 Secrets 中的固定签名密钥。"
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair \
              -keystore android/app/release.jks -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Gyro Holo Wallpaper, O=CI, C=CN"
            printf '%s' "$PASS" > "$RUNNER_TEMP/ks/store.pass"
            printf '%s' "$PASS" > "$RUNNER_TEMP/ks/key.pass"
            echo "alias=ci" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用一次性签名密钥；配置 Secrets 后可获得稳定签名。"
          fi

      - name: Assemble release APK
        working-directory: android
        env:
          KEYSTORE_FILE: app/release.jks
          KEY_ALIAS: ${{ steps.ks.outputs.alias }}
        run: |
          set -euo pipefail
          export KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/ks/store.pass")"
          export KEY_PASSWORD="$(cat "$RUNNER_TEMP/ks/key.pass")"
          gradle :app:assembleRelease --no-daemon

      - name: Compute checksum and version info
        env:
          STABLE_SIGNING: ${{ steps.ks.outputs.stable }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK" | tee APK_SHA256.txt
          {
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "signed_with=stable-keystore" 
          } > BUILD_INFO.txt
          if [ "${STABLE_SIGNING}" != "true" ]; then
            sed -i 's/signed_with=.*/signed_with=ephemeral-ci-key/' BUILD_INFO.txt
          fi
          cat BUILD_INFO.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            APK_SHA256.txt
            BUILD_INFO.txt

      - name: Remove decoded keystore
        if: always()
        run: rm -rf android/app/release.jks "$RUNNER_TEMP/ks"
