<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>星穹棱镜 · 陀螺仪全息动态壁纸</title>
<style>
  :root { color-scheme: dark; --ink: #eef1ff; --muted: #a9b0d0; --line: rgba(255,255,255,.16); --panel: rgba(12,16,38,.72); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080b1d; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #gl, #css-layers { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #css-layers { overflow: hidden; }
  .layer { position: absolute; inset: -6%; background-size: cover; background-position: center; background-repeat: no-repeat; will-change: transform; }
  .layer.bg { transform: scale(1.1); }
  .layer.subject, .layer.text { background-size: contain; }
  .layer.glint { background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.55), rgba(255,190,235,.18) 22%, transparent 55%); background-size: 160% 160%; mix-blend-mode: screen; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); letter-spacing: .1em; }
  #loading[hidden] { display: none; }
  #hud { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); backdrop-filter: blur(12px); font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  #hud[hidden] { display: none; }
  #hud b { color: var(--ink); font-weight: 500; }
  #gate { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; background: linear-gradient(transparent, rgba(5,8,24,.72)); transition: opacity .45s ease, visibility .45s; }
  #gate.dismissed { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate .kicker { font-size: 12px; letter-spacing: .34em; color: #c9b6ff; }
  #gate h1 { margin: 0; font-size: 30px; font-weight: 500; letter-spacing: .12em; }
  #gate p { margin: 0; max-width: 22em; font-size: 13px; line-height: 1.8; color: var(--muted); }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #permission { margin-top: 8px; padding: 12px 30px; background: rgba(160,130,255,.22); border-color: rgba(190,165,255,.6); }
  #panel { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: 520px; margin: auto; padding: 14px 16px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(16px); }
  #panel.collapsed .body { display: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel-head strong { font-size: 13px; font-weight: 500; letter-spacing: .06em; }
  #panel-toggle { padding: 4px 12px; font-size: 12px; }
  .body { margin-top: 12px; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; font-size: 12px; color: var(--muted); }
  .row label { width: 68px; flex: none; }
  .row input[type=range] { flex: 1; accent-color: #b39aff; height: 20px; }
  .row output { width: 36px; text-align: right; font-family: ui-monospace, monospace; }
  .finishes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .finishes button { padding: 6px 14px; font-size: 12px; }
  .finishes button.active { background: rgba(160,130,255,.3); border-color: rgba(190,165,255,.7); }
  .meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 11px; color: #7f88ad; }
  #hint { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #ffd9a8; }
  #hint[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="css-layers" hidden></div>
  <div id="loading">正在装裱卡面…</div>

  <div id="hud" hidden>
    <div>source&nbsp; <b id="source-badge">fallback</b></div>
    <div>view.x&nbsp; <b id="view-x">0.000</b></div>
    <div>view.y&nbsp; <b id="view-y">0.000</b></div>
    <div>fps&nbsp;&nbsp;&nbsp; <b id="fps">0</b></div>
  </div>

  <div id="gate">
    <div class="kicker">HOLO WALLPAPER / STAGE 1</div>
    <h1>星穹棱镜</h1>
    <p>倾斜手机，镭射高光与分层景深会跟着视角游走。首次启用需要授权「动作与方向」，且页面必须运行在 HTTPS 或 localhost 下。</p>
    <button id="permission" type="button">启用体感 · 开始体验</button>
    <p style="font-size:11px;opacity:.7">无陀螺仪的设备可用指针拖动模拟；桌面端会自动巡游。</p>
  </div>

  <section id="panel">
    <div class="panel-head">
      <strong>调参 · <span id="finish-name">珠光</span></strong>
      <span id="source" style="font-size:11px;color:var(--muted)">初始化中</span>
      <button id="panel-toggle" type="button">收起</button>
    </div>
    <div class="body">
      <div class="row"><label>镭射强度</label><input id="foil" type="range" min="0" max="1" step="0.01"><output id="foil-out"></output></div>
      <div class="row"><label>闪光增益</label><input id="glint" type="range" min="0" max="1.6" step="0.01"><output id="glint-out"></output></div>
      <div class="row"><label>主体景深</label><input id="depth" type="range" min="-0.2" max="1" step="0.01"><output id="depth-out"></output></div>
      <div class="row"><label>残影强度</label><input id="trail" type="range" min="0" max="1.5" step="0.01"><output id="trail-out"></output></div>
      <div class="row"><label>卡片尺寸</label><input id="card" type="range" min="0.6" max="1.3" step="0.01"><output id="card-out"></output></div>
      <div class="finishes modes">
        <button data-mode="1" class="active" type="button">官方卡片透视</button>
        <button data-mode="0" type="button">全屏铺满</button>
      </div>
      <div class="finishes">
        <button data-finish="0" class="active" type="button">珠光</button>
        <button data-finish="1" type="button">银箔</button>
        <button data-finish="2" type="button">原画</button>
        <button data-finish="3" type="button">烫金</button>
        <button id="calibrate" type="button" disabled>校准中性姿态</button>
      </div>
      <div class="meta"><span>RuiC-card-skill GLSL · WebGL1 单 draw call</span><span>阶段一验证版</span></div>
      <div id="hint" hidden></div>
    </div>
  </section>
</div>

<script>window.__WALLPAPER_ASSETS__ = null;</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
